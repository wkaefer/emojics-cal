<script>
/* ---- Data baked in at render time ---- */
const IMAGES   = ${imagesJson};
const DATE_KEY = ${JSON.stringify(dateKey)};
const EVENT_ID = ${JSON.stringify(ev.id)};
const EMOJIS   = ${emojiJson};
const PALETTE  = ${JSON.stringify(palette)};

/* ---- Seeded PRNG ---- */
function strSeed(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++)
    h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0;
  return h;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- SVG helpers ---- */

// Jagged torn-paper clip-path
function tornPathD(w, h, rng, teeth) {
  teeth = teeth || 10;
  const jag = Math.min(w, h) * 0.07;
  const pts = [];

  // top edge — left to right
  for (let i = 0; i <= teeth; i++) {
    const x = (w / teeth) * i;
    const y = i === 0 || i === teeth ? 0 : (rng() - 0.5) * jag;
    pts.push([x, y]);
  }
  // right edge — top to bottom
  for (let i = 1; i <= teeth; i++) {
    const y = (h / teeth) * i;
    const x = i === teeth ? w : w + (rng() - 0.5) * jag;
    pts.push([x, y]);
  }
  // bottom edge — right to left
  for (let i = teeth - 1; i >= 0; i--) {
    const x = (w / teeth) * i;
    const y = i === 0 ? h : h + (rng() - 0.5) * jag;
    pts.push([x, y]);
  }
  // left edge — bottom to top
  for (let i = teeth - 1; i >= 1; i--) {
    const y = (h / teeth) * i;
    const x = (rng() - 0.5) * jag;
    pts.push([x, y]);
  }
  pts.push(pts[0]);
  return 'M ' + pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' L ') + ' Z';
}

// Scalloped clip-path
function scallopPathD(w, h, rng) {
  const r = Math.min(w, h) * 0.055 + rng() * 3;
  const pts = [];
  function scallop(x0, y0, x1, y1, n, nx, ny) {
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 0.5) / n, t2 = (i + 1) / n;
      const px = x0 + (x1 - x0) * t0, py = y0 + (y1 - y0) * t0;
      const cx = x0 + (x1 - x0) * t1 + nx * r, cy = y0 + (y1 - y0) * t1 + ny * r;
      const qx = x0 + (x1 - x0) * t2, qy = y0 + (y1 - y0) * t2;
      pts.push(\`L \${px.toFixed(1)},\${py.toFixed(1)} Q \${cx.toFixed(1)},\${cy.toFixed(1)} \${qx.toFixed(1)},\${qy.toFixed(1)}\`);
    }
  }
  const nT = Math.max(3, Math.round(w / (r * 2.2)));
  const nS = Math.max(3, Math.round(h / (r * 2.2)));
  pts.push(\`M 0,0\`);
  scallop(0, 0, w, 0, nT, 0, -1);
  scallop(w, 0, w, h, nS, 1, 0);
  scallop(w, h, 0, h, nT, 0, 1);
  scallop(0, h, 0, 0, nS, -1, 0);
  return pts.join(' ') + ' Z';
}

// Deckle-edge wavy clip-path
function decklePathD(w, h, rng) {
  const amp  = Math.min(w, h) * 0.06;
  const freq = 6 + Math.floor(rng() * 4);
  function wavePts(x0, y0, x1, y1, n, nx, ny, rev) {
    const out = [];
    for (let i = rev ? n : 0; rev ? i >= 0 : i <= n; rev ? i-- : i++) {
      const t  = i / n;
      const bx = x0 + (x1 - x0) * t;
      const by = y0 + (y1 - y0) * t;
      const wave = Math.sin(t * Math.PI * freq) * amp;
      out.push(\`\${(bx + nx * wave).toFixed(1)},\${(by + ny * wave).toFixed(1)}\`);
    }
    return out;
  }
  const top    = wavePts(0, 0, w, 0,   freq * 2, 0,  1, false);
  const right  = wavePts(w, 0, w, h,   freq * 2, 1,  0, false);
  const bottom = wavePts(0, h, w, h,   freq * 2, 0, -1, true);
  const left   = wavePts(0, 0, 0, h,   freq * 2, -1, 0, true);
  return 'M ' + top.join(' L ') + ' L ' + right.join(' L ') +
         ' L ' + bottom.join(' L ') + ' L ' + left.join(' L ') + ' Z';
}

/* ---- Washi tape strips ---- */
function addWashiTape(container, imgW, imgH, rng) {
  const colors = [PALETTE.tape, PALETTE.tape2];
  const count  = 2 + Math.floor(rng() * 2); // 2 or 3
  for (let i = 0; i < count; i++) {
    const tape = document.createElement('div');
    tape.className = 'tape-strip';
    const color = colors[Math.floor(rng() * colors.length)];
    // Tape across a corner/edge — random position and angle
    const isHoriz = rng() > 0.4;
    const tapeW   = isHoriz ? 50 + rng() * 40 : 10 + rng() * 6;
    const tapeH   = isHoriz ? 10 + rng() * 6  : 50 + rng() * 40;
    const rot     = (rng() - 0.5) * 40;  // ±20deg
    // Position near corners
    const corners = [
      { top: -tapeH/2,           left: imgW * 0.1 + rng() * imgW * 0.3 },
      { top: imgH - tapeH/2,     left: imgW * 0.1 + rng() * imgW * 0.3 },
      { top: imgH * 0.1,         left: -tapeW/2 },
      { top: imgH * 0.1,         left: imgW - tapeW/2 },
    ];
    const corner = corners[Math.floor(rng() * corners.length)];
    Object.assign(tape.style, {
      background: color,
      width:  tapeW + 'px',
      height: tapeH + 'px',
      top:    corner.top  + 'px',
      left:   corner.left + 'px',
      transform: \`rotate(\${rot}deg)\`,
    });
    container.appendChild(tape);
  }
}

/* ---- Build tile for one image ---- */
function buildTile(img, shuffleNonce) {
  const seed = strSeed(img.id + DATE_KEY + String(shuffleNonce));
  const rng  = mulberry32(seed);

  // Rotation and offset
  const rot    = (rng() - 0.5) * 8;   // ±4deg
  const tx     = (rng() - 0.5) * 16;
  const ty     = (rng() - 0.5) * 16;

  const styleChoice = Math.floor(rng() * 5);
  // 0 torn, 1 scallop, 2 deckle, 3 polaroid, 4 frame/double

  const tile = document.createElement('div');
  tile.className = 'photo-tile';
  tile.title = 'Click to view full size';
  tile.style.transform = \`rotate(\${rot.toFixed(2)}deg) translate(\${tx.toFixed(1)}px, \${ty.toFixed(1)}px)\`;
  tile.style.zIndex = Math.floor(rng() * 5);

  const image = new Image();
  image.src = img.dataUrl || img.srcUrl || '';
  image.style.maxWidth  = '220px';
  image.style.maxHeight = '180px';
  image.style.display   = 'block';

  // For URL-backed items, replace the broken image with an emoji tile
  // that still gets decorated (washi tape etc.) so the layout stays intact.
  let brokenTileInserted = false;
  if (!img.dataUrl && img.srcUrl) {
    image.onerror = () => {
      if (brokenTileInserted) return;
      brokenTileInserted = true;
      const fb = document.createElement('div');
      fb.style.cssText =
        'width:160px;height:120px;display:flex;align-items:center;' +
        'justify-content:center;font-size:4rem;background:#f3f3f3;' +
        'border-radius:4px;border:1px dashed #ccc;';
      fb.textContent = '🖼️';
      image.replaceWith(fb);
    };
  }

  if (styleChoice === 3) {
    // ---- Polaroid ----
    tile.classList.add('style-polaroid');
    tile.appendChild(image);
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = DATE_KEY;
    tile.appendChild(cap);
    addWashiTape(tile, 220, 220, rng);

  } else if (styleChoice === 4) {
    // ---- Solid frame or double frame ----
    const isDouble = rng() > 0.5;
    tile.classList.add(isDouble ? 'style-double' : 'style-frame');
    tile.appendChild(image);
    addWashiTape(tile, 220, 200, rng);

  } else {
    // ---- SVG clip-path styles: torn (0), scallop (1), deckle (2) ----
    const wrap = document.createElement('div');
    wrap.className = 'clip-wrap';

    // We need actual image dimensions after load to generate the SVG path
    const svgId = 'clip-' + Math.random().toString(36).slice(2);

    image.onload = () => {
      const iw = image.naturalWidth;
      const ih = image.naturalHeight;
      // Constrain to max display size, keep aspect
      const scale = Math.min(220 / iw, 180 / ih, 1);
      const dw = Math.round(iw * scale);
      const dh = Math.round(ih * scale);
      image.style.width  = dw + 'px';
      image.style.height = dh + 'px';
      wrap.style.width   = dw + 'px';
      wrap.style.height  = dh + 'px';

      let pathD;
      if (styleChoice === 0) pathD = tornPathD(dw, dh, rng, 12);
      else if (styleChoice === 1) pathD = scallopPathD(dw, dh, rng);
      else pathD = decklePathD(dw, dh, rng);

      // Inject inline SVG with clipPath
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      clip.setAttribute('id', svgId);
      clip.setAttribute('clipPathUnits', 'userSpaceOnUse');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      clip.appendChild(path);
      defs.appendChild(clip);
      svg.appendChild(defs);
      wrap.insertBefore(svg, wrap.firstChild);
      image.style.clipPath = \`url(#\${svgId})\`;

      // Coloured border ring echoing the clip shape using a second SVG overlay
      const border = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      border.setAttribute('width', dw); border.setAttribute('height', dh);
      border.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
      const bPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bPath.setAttribute('d', pathD);
      bPath.setAttribute('fill', 'none');
      bPath.setAttribute('stroke', PALETTE.border);
      bPath.setAttribute('stroke-width', '3');
      bPath.setAttribute('opacity', '0.85');
      border.appendChild(bPath);
      wrap.appendChild(border);

      addWashiTape(tile, dw, dh, rng);
    };

    wrap.appendChild(image);
    tile.appendChild(wrap);
  }

  // Click → open gallery in main window at this index
  tile.addEventListener('click', () => {
    if (window.opener && !window.opener.closed) {
      window.opener.openGallery(DATE_KEY, EVENT_ID, img.index);
      window.opener.focus();
    }
  });

  return tile;
}

/* ---- Sticker strip ---- */
function renderStickers() {
  const strip = document.getElementById('sticker-strip');
  if (!strip) return;
  strip.innerHTML = '';
  const seed = strSeed(DATE_KEY + 'stickers');
  const rng  = mulberry32(seed);
  EMOJIS.forEach(em => {
    const s = document.createElement('span');
    s.className = 'sticker';
    s.textContent = em;
    const rot = (rng() - 0.5) * 24;
    const dy  = (rng() - 0.5) * 8;
    s.style.transform = \`rotate(\${rot.toFixed(1)}deg) translateY(\${dy.toFixed(1)}px)\`;
    strip.appendChild(s);
  });
}

/* ---- Main render ---- */
let shuffleNonce = 0;
function renderCollage() {
  const collage = document.getElementById('collage');
  collage.innerHTML = '';
  if (IMAGES.length === 0) {
    collage.innerHTML = '<div class="no-images">(no photos for this day)</div>';
    return;
  }
  for (const img of IMAGES) {
    collage.appendChild(buildTile(img, shuffleNonce));
  }
}

document.getElementById('shuffle-btn').onclick = () => {
  shuffleNonce++;
  renderCollage();
};

renderStickers();
renderCollage();
<\/script>
</body>
</html>`;

  const w = window.open('', '_blank', 'width=920,height=800,resizable=yes,scrollbars=yes');
  if (!w) {
    alert('Pop-up blocked — please allow pop-ups to use Scrapbook.');
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* =============================================================
 * Toast
 * ============================================================= */
let toastTimer = null;
let pendingFinalize = null;
function finalizePending() {
  if (pendingFinalize) { try { pendingFinalize(); } catch{} pendingFinalize = null; }
}
function showToast(msg, undoFn) {
  finalizePending();
  const root = document.getElementById('toast-root');
  root.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${escapeHtml(msg)}</span><button>Undo</button>`;
  root.appendChild(t);
  const dismiss = () => {
    if (t.parentNode) t.parentNode.removeChild(t);
    pendingFinalize = null;
    clearTimeout(toastTimer);
    toastTimer = null;
  };
  pendingFinalize = dismiss;
  t.querySelector('button').onclick = async () => {
    clearTimeout(toastTimer);
    pendingFinalize = null;
    dismiss();
    await undoFn();
  };
  toastTimer = setTimeout(dismiss, 6000);
}
window.addEventListener('beforeunload', finalizePending);

/* =============================================================
 * Navigation
 * ============================================================= */
function prevMonth() { if (--state.month < 0) { state.month = 11; state.year--; } renderCalendar(); }
function nextMonth() { if (++state.month > 11) { state.month = 0;  state.year++; } renderCalendar(); }
function prevYear()  { state.year--; renderCalendar(); }
function nextYear()  { state.year++; renderCalendar(); }
function goToday()   {
  const d = new Date();
  state.year = d.getFullYear();
  state.month = d.getMonth();
  renderCalendar();
}

document.getElementById('prevMonth').onclick = prevMonth;
document.getElementById('nextMonth').onclick = nextMonth;
document.getElementById('prevYear').onclick  = prevYear;
document.getElementById('nextYear').onclick  = nextYear;
document.getElementById('todayBtn').onclick  = goToday;

document.addEventListener('keydown', e => {
  // Allow normal text input in modal
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (state._galleryHandler) {
    state._galleryHandler(e);
    return;
  }
  if (state.modalOpen) {
    if (e.key === 'Escape') {
      document.getElementById('modal-root').innerHTML = '';
      state.modalOpen = false;
    }
    return;
  }
  if (e.key === 'ArrowLeft')  prevMonth();
  if (e.key === 'ArrowRight') nextMonth();
  if (e.key === 'ArrowUp')    prevYear();
  if (e.key === 'ArrowDown')  nextYear();
  if (e.key === 't' || e.key === 'T') goToday();
});

/* =============================================================
 * Util
 * ============================================================= */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =============================================================
 * ICS export / import (RFC 5545, all-day events, inline image ATTACH)
 * ============================================================= */

// Fold long lines per RFC 5545: 75 octets, continuation lines start with a single space.
function icsFold(line) {
  const enc = new TextEncoder();
  const bytes = enc.encode(line);
  if (bytes.length <= 75) return line;
  // Walk the string by codepoint to avoid splitting multi-byte chars across folds.
  const out = [];
  let buf = '';
  let bufBytes = 0;
  let first = true;
  for (const ch of line) {
    const chBytes = enc.encode(ch).length;
    const limit = first ? 75 : 74; // continuation lines have a leading space
    if (bufBytes + chBytes > limit) {
      out.push((first ? '' : ' ') + buf);
      first = false;
      buf = ch;
      bufBytes = chBytes;
    } else {
      buf += ch;
      bufBytes += chBytes;
    }
  }
  if (buf) out.push((first ? '' : ' ') + buf);
  return out.join('\r\n');
}

// Escape per RFC 5545 §3.3.11 for TEXT values.
function icsEscape(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/\r\n|\r|\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

function icsUnescape(s) {
  return String(s == null ? '' : s)
    .replace(/\\n/gi, '\n')
    .replace(/\\,/g, ',')
    .replace(/\\;/g, ';')
    .replace(/\\\\/g, '\\');
}

function icsDateOnly(dateKey) {
  // YYYY-MM-DD -> YYYYMMDD
  return dateKey.replace(/-/g, '');
}

function icsAddDays(dateKey, days) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(dt.getUTCDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

function icsNowStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T` +
         `${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result);
      const i = s.indexOf(',');
      res(i >= 0 ? s.slice(i + 1) : s);
    };
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

function base64ToBlob(b64, mime) {
  const clean = String(b64).replace(/\s+/g, '');
  const bin = atob(clean);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || 'application/octet-stream' });
}

async function imageDimensions(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const out = { width: bmp.width, height: bmp.height };
    bmp.close && bmp.close();
    return out;
  } catch {
    return { width: 0, height: 0 };
  }
}

const SCRAPBOOK_BASE_URL = 'https://www.k5f2.org/emojics-cal/';

function scrapbookUrlFor(dateKey) {
  return `${SCRAPBOOK_BASE_URL}?scrapbook=${encodeURIComponent(dateKey)}`;
}

async function buildIcsEvent(ev) {
  // NOTE: ev.emojis is intentionally NOT serialized here. Day-tag emojis are a
  // local-only annotation stored alongside the event in IndexedDB; they must
  // not leak into .ics output (export, upload, or download).
  // UID is keyed by event id so multiple events per day don't collide.
  const uid = `scrapbook-${ev.id || ev.dateKey}@local`;
  const dtstart = icsDateOnly(ev.dateKey);
  const dtend = icsDateOnly(icsAddDays(ev.dateKey, 1)); // exclusive end per RFC
  const summary = ev.title || '(untitled)';
  const url = scrapbookUrlFor(ev.dateKey);
  // Most calendar apps ignore inline ATTACH images, so we also include a
  // clickable link back to the live scrapbook page in both URL and DESCRIPTION.
  const descParts = [];
  if (ev.description) descParts.push(ev.description);
  descParts.push(`View scrapbook: ${url}`);
  const desc = descParts.join('\n\n');
  const lines = [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${icsNowStamp()}`,
    `DTSTART;VALUE=DATE:${dtstart}`,
    `DTEND;VALUE=DATE:${dtend}`,
    `SUMMARY:${icsEscape(summary)}`,
    `URL:${url}`,
    `DESCRIPTION:${icsEscape(desc)}`,
  ];

  // Inline image attachment (RFC 5545 §3.8.1.1) — first image only.
  // Calendar clients rarely render multiple inline images, and big payloads
  // can break email delivery. The full gallery lives at the scrapbook URL.
  const firstId = (ev.imageIds || [])[0];
  if (firstId) {
    try {
      const rec = await getImage(firstId);
      if (rec && rec.blob) {
        const b64 = await blobToBase64(rec.blob);
        const mime = rec.mime || rec.blob.type || 'application/octet-stream';
        lines.push(`ATTACH;FMTTYPE=${mime};ENCODING=BASE64;VALUE=BINARY:${b64}`);
      }
    } catch (err) {
      console.warn('Skipping image attachment', firstId, err);
    }
  }

  // URI-form attachments for URL-backed images (RFC 5545 §3.8.1.1)
  for (const entry of (ev.imageUrls || [])) {
    lines.push(`ATTACH;VALUE=URI:${entry.url}`);
  }

  lines.push('END:VEVENT');
  return lines.map(icsFold).join('\r\n');
}

async function buildIcsCalendar(events) {
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//CalendarScrapbook//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
  ];
  const out = [lines.map(icsFold).join('\r\n')];
  for (const ev of events) out.push(await buildIcsEvent(ev));
  out.push('END:VCALENDAR');
  return out.join('\r\n') + '\r\n';
}

function downloadFile(name, mime, content) {
  const blob = (content instanceof Blob) ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportEventToIcs(eventId) {
  const ev = await getEventById(eventId);
  if (!ev) return;
  const ics = await buildIcsCalendar([ev]);
  const safeTitle = (ev.title || 'event').replace(/[^a-z0-9-_]+/gi, '_').slice(0, 40);
  downloadFile(`scrapbook-${ev.dateKey}-${safeTitle}.ics`, 'text/calendar', ics);
}

async function emailEventIcs(eventId) {
  const ev = await getEventById(eventId);
  if (!ev) return;
  const ics = await buildIcsCalendar([ev]);
  const safeTitle = (ev.title || 'event').replace(/[^a-z0-9-_]+/gi, '_').slice(0, 40);
  const filename = `scrapbook-${ev.dateKey}-${safeTitle}.ics`;
  const subject = encodeURIComponent(`📅 Calendar event: ${ev.title || ev.dateKey}`);

  // Silently push to the server so the scrapbook deep-link URL in the email
  // can auto-import on the recipient's device. Failures here are non-fatal:
  // worst case the URL just won't find the .ics and the recipient still has
  // the attachment from Web Share / mailto.
  try {
    await uploadEventToServerSilent(eventId, ics);
  } catch (err) {
    console.warn('Server upload failed (continuing with email):', err);
  }

  // Try Web Share API first (works on mobile and some desktop browsers)
  if (navigator.canShare) {
    const file = new File([ics], filename, { type: 'text/calendar' });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: ev.title || ev.dateKey });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return; // user cancelled — do nothing
        // fall through to mailto fallback
      }
    }
  }

  // Fallback: download the file then open mailto so the user can attach it manually
  downloadFile(filename, 'text/calendar', ics);
  const scrapbookUrl = scrapbookUrlFor(ev.dateKey);
  const body = encodeURIComponent(
    `Hi,\n\nPlease find the calendar event attached as "${filename}".\n\n` +
    `View the full scrapbook (with all images) here:\n${scrapbookUrl}\n\n` +
    `(Attach the .ics file that was just downloaded to your Downloads folder.)`
  );
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

/* ---- Server CGI integration for .ics files ---- */
const ICS_CGI_LIST = 'ics-list.cgi';
const ICS_CGI_PUT  = 'ics-put.cgi';
const ICS_CGI_GET  = 'ics-get.cgi';

function icsServerFilename(ev) {
  const safe = (ev.title || 'event').replace(/[^a-z0-9-_]+/gi, '_').slice(0, 40)
    || 'event';
  // Include a short slice of the id so multiple events on the same date
  // get distinct filenames and don't overwrite each other.
  const idSlug = (ev.id || ev.dateKey).replace(/[^a-z0-9]/gi, '').slice(0, 8);
  return `scrapbook-${ev.dateKey}-${idSlug}-${safe}.ics`;
}

async function uploadEventToServerSilent(eventId, prebuiltIcs) {
  // Internal helper used by emailEventIcs(): no toast, no alert.
  // Pass prebuiltIcs to avoid rebuilding the calendar string.
  const ev = await getEventById(eventId);
  if (!ev) return;
  const ics = prebuiltIcs || await buildIcsCalendar([ev]);
  const name = icsServerFilename(ev);
  const res = await fetch(`${ICS_CGI_PUT}?name=${encodeURIComponent(name)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'text/calendar; charset=utf-8' },
    body: ics,
  });
  if (!res.ok) throw new Error(`Server returned ${res.status}`);
}

async function uploadEventToServer(eventId) {
  const ev = await getEventById(eventId);
  if (!ev) return;
  const ics = await buildIcsCalendar([ev]);
  const name = icsServerFilename(ev);
  try {
    const res = await fetch(`${ICS_CGI_PUT}?name=${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'text/calendar; charset=utf-8' },
      body: ics,
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json().catch(() => ({}));
    showToast(`Uploaded: ${data.name || name}`, () => {});
  } catch (err) {
    console.error(err);
    alert(`Upload failed: ${err.message}\n\nMake sure the page is served via Apache and CGI is enabled for cgi-bin/.`);
  }
}

async function listServerIcsFiles() {
  const res = await fetch(ICS_CGI_LIST, { cache: 'no-store' });
  if (!res.ok) throw new Error(`List failed: ${res.status}`);
  return res.json();
}

async function fetchServerIcsFile(name) {
  const res = await fetch(`${ICS_CGI_GET}?name=${encodeURIComponent(name)}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
  return res.text();
}


/* ---- ICS parser ----
 * Minimal RFC 5545 parser: unfolds continuation lines, handles VEVENTs only,
 * understands DTSTART (date or date-time), SUMMARY, DESCRIPTION, UID.
 */
function parseIcs(text) {
  // Normalize line endings; unfold continuation lines (line starting with space/tab).
  const raw = text.replace(/\r\n?/g, '\n').split('\n');
  const lines = [];
  for (const ln of raw) {
    if (ln.length && (ln[0] === ' ' || ln[0] === '\t') && lines.length) {
      lines[lines.length - 1] += ln.slice(1);
    } else {
      lines.push(ln);
    }
  }

  const events = [];
  let cur = null;
  for (const line of lines) {
    if (!line) continue;
    if (line === 'BEGIN:VEVENT') { cur = { attachments: [] }; continue; }
    if (line === 'END:VEVENT')   { if (cur) events.push(cur); cur = null; continue; }
    if (!cur) continue;
    // Split "PROP;params:value"
    const colon = line.indexOf(':');
    if (colon < 0) continue;
    const left = line.slice(0, colon);
    const value = line.slice(colon + 1);
    const semi = left.indexOf(';');
    const prop = (semi < 0 ? left : left.slice(0, semi)).toUpperCase();
    const params = {};
    if (semi >= 0) {
      for (const part of left.slice(semi + 1).split(';')) {
        const eq = part.indexOf('=');
        if (eq > 0) {
          // Preserve original-case param values (FMTTYPE needs its case for MIME).
          params[part.slice(0, eq).toUpperCase()] = part.slice(eq + 1);
        }
      }
    }
    switch (prop) {
      case 'UID':         cur.uid = value; break;
      case 'SUMMARY':     cur.summary = icsUnescape(value); break;
      case 'DESCRIPTION': cur.description = icsUnescape(value); break;
      case 'DTSTART':     cur.dtstart = { value, params }; break;
      case 'ATTACH': {
        const enc = (params.ENCODING || '').toUpperCase();
        const valType = (params.VALUE || '').toUpperCase();
        if (enc === 'BASE64' && valType === 'BINARY') {
          try {
            const mime = params.FMTTYPE || 'application/octet-stream';
            const blob = base64ToBlob(value, mime);
            cur.attachments.push({ blob, mime });
          } catch (err) {
            console.warn('Bad ATTACH payload, skipping', err);
          }
        } else if (valType === 'URI' || (!enc && normalizeImageUrl(value))) {
          // URI-form ATTACH — store as an imageUrl entry
          const url = normalizeImageUrl(value);
          if (url) {
            if (!cur.imageUrls) cur.imageUrls = [];
            cur.imageUrls.push(url);
          }
        }
        break;
      }
    }
  }

  // Convert to scrapbook events keyed by dateKey
  const out = [];
  for (const e of events) {
    if (!e.dtstart) continue;
    const v = e.dtstart.value;
    let dateKey = null;
    if (/^\d{8}$/.test(v)) {
      dateKey = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
    } else if (/^\d{8}T\d{6}/.test(v)) {
      // Date-time form; take the date portion (ignore TZ for scrapbook all-day model).
      dateKey = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
    } else {
      continue;
    }
    out.push({
      uid:          e.uid || null,
      dateKey,
      title: e.summary || '',
      description: stripScrapbookPhotoNote(e.description || ''),
      imageIds: [],
      attachments: e.attachments || [],
      importedUrls: (e.imageUrls || []),
    });
  }
  // De-dup within the file: last one wins per uid (fall back to dateKey when no uid)
  const map = new Map();
  for (const e of out) map.set(e.uid || e.dateKey, e);
  return [...map.values()];
}

// Strip the auto-appended "(N photos in scrapbook)" note we add on export, so
// round-trip imports don't accumulate it.
function stripScrapbookPhotoNote(s) {
  return s
    .replace(/\n*\(\d+ photos? in scrapbook\)\s*$/i, '')
    .trimEnd();
}

async function importIcsText(text, sourceLabel) {
  const incoming = parseIcs(text);
  if (incoming.length === 0) {
    alert(`No events found in ${sourceLabel || 'this file'}.`);
    return;
  }

  /*
   * Conflict detection: an incoming VEVENT conflicts with an existing record
   * when its UID matches an existing event's id pattern `scrapbook-<id>@local`.
   * Fall back to dateKey matching for legacy UIDs (v1 format: scrapbook-YYYY-MM-DD@local).
   */
  async function findExistingByUid(incoming) {
    if (incoming.uid) {
      // Our own UIDs: scrapbook-<eventId>@local
      const m = incoming.uid.match(/^scrapbook-(.+)@local$/);
      if (m) {
        const candidate = await getEventById(m[1]);
        if (candidate) return candidate;
      }
    }
    // Fall back: check if any personal event already exists on this date with this title
    const evs = await getEventsForDate(incoming.dateKey);
    return evs.find(e => e.category === 'personal' && e.title === incoming.title) || null;
  }

  const conflicts = [];
  for (const ev of incoming) {
    const existing = await findExistingByUid(ev);
    if (existing) conflicts.push({ incoming: ev, existing });
  }
  const mode = await askImportMode(incoming.length, conflicts.length);
  if (!mode) return; // cancelled

  let added = 0, replaced = 0, skipped = 0, imagesAdded = 0;

  // Convert a list of plain URL strings (from ICS import) into imageUrl objects
  function urlStringsToEntries(urls) {
    const now = Date.now();
    return (urls || []).map((url, i) => ({ url, addedAt: now + i }));
  }

  async function installAttachments(dateKey, attachments) {
    const ids = [];
    for (const att of (attachments || [])) {
      try {
        const { width, height } = await imageDimensions(att.blob);
        const rec = await addImage(dateKey, att.blob, att.mime, width, height);
        ids.push(rec.id);
        imagesAdded++;
      } catch (err) {
        console.warn('Failed to install attachment', err);
      }
    }
    return ids;
  }

  for (const ev of incoming) {
    const existing = await findExistingByUid(ev);
    if (existing) {
      if (mode === 'skip' || mode === 'merge')  { skipped++; continue; }
      // overwrite: replace title/description AND replace images with the .ics ones
      for (const oldId of (existing.imageIds || [])) {
        try { await deleteImage(oldId); } catch {}
      }
      const newIds = await installAttachments(ev.dateKey, ev.attachments);
      const merged = {
        ...existing,
        title: ev.title || existing.title,
        description: ev.description || existing.description,
        imageIds: newIds,
        imageUrls: urlStringsToEntries(ev.importedUrls),
      };
      await putEvent(merged);
      replaced++;
    } else {
      // New event: write first so addImage records have a stable parent, then attach.
      const fresh = {
        dateKey:     ev.dateKey,
        category:    'personal',
        readOnly:    false,
        source:      sourceLabel || null,
        title:       ev.title,
        description: ev.description,
        imageIds:    [],
        imageUrls:   urlStringsToEntries(ev.importedUrls),
      };
      await putEvent(fresh);
      const newIds = await installAttachments(ev.dateKey, ev.attachments);
      if (newIds.length > 0) {
        fresh.imageIds = newIds;
        await putEvent(fresh);
      }
      added++;
    }
  }
  await renderCalendar();
  const imgNote = imagesAdded > 0 ? ` (${imagesAdded} image${imagesAdded === 1 ? '' : 's'})` : '';
  showToast(`Imported: ${added} added, ${replaced} replaced, ${skipped} skipped${imgNote}`, () => {});
}

async function openServerIcsBrowser() {
  let files;
  try {
    files = await listServerIcsFiles();
  } catch (err) {
    alert(`Could not list server .ics files: ${err.message}\n\n` +
          `Make sure the page is served via Apache and ics-list.cgi is executable.`);
    return;
  }
  // Sort newest first
  files.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));

  const root = document.getElementById('modal-root');
  state.modalOpen = true;
  const fmtSize = b => b < 1024 ? `${b} B` : `${(b/1024).toFixed(1)} KB`;
  const fmtTime = ts => new Date(ts * 1000).toLocaleString();
  const rows = files.length === 0
    ? '<p style="color:#999;font-style:italic;">No .ics files on the server yet. Upload one from an event modal first.</p>'
    : `<table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
         <thead><tr style="text-align:left; border-bottom:1px solid #ddd;">
           <th style="padding:6px;"><input type="checkbox" id="ics-all" /></th>
           <th style="padding:6px;">Filename</th>
           <th style="padding:6px;">Size</th>
           <th style="padding:6px;">Modified</th>
         </tr></thead>
         <tbody>
         ${files.map(f => `
           <tr style="border-bottom:1px solid #f0f0f0;">
             <td style="padding:6px;"><input type="checkbox" class="ics-pick" value="${escapeHtml(f.name)}" /></td>
             <td style="padding:6px;font-family:monospace;">${escapeHtml(f.name)}</td>
             <td style="padding:6px;color:#666;">${fmtSize(f.size)}</td>
             <td style="padding:6px;color:#666;">${fmtTime(f.mtime)}</td>
           </tr>
         `).join('')}
         </tbody>
       </table>`;

  root.innerHTML = `
    <div class="modal-backdrop" id="ics-srv-backdrop">
      <div class="modal" style="max-width:640px;">
        <h2>Import from server</h2>
        <p style="font-size:0.85rem; color:#666;">Files in <code>.ics/</code></p>
        ${rows}
        <div class="modal-actions">
          <button class="btn" id="ics-srv-cancel">Cancel</button>
          <button class="btn btn-primary" id="ics-srv-import" ${files.length === 0 ? 'disabled' : ''}>Import Selected</button>
        </div>
      </div>
    </div>
  `;
  const close = () => { root.innerHTML = ''; state.modalOpen = false; };
  document.getElementById('ics-srv-cancel').onclick = close;
  document.getElementById('ics-srv-backdrop').addEventListener('click', e => {
    if (e.target.id === 'ics-srv-backdrop') close();
  });
  const allCb = document.getElementById('ics-all');
  if (allCb) {
    allCb.onchange = () => {
      root.querySelectorAll('.ics-pick').forEach(cb => { cb.checked = allCb.checked; });
    };
  }
  const importBtn = document.getElementById('ics-srv-import');
  if (importBtn) importBtn.onclick = async () => {
    const picks = [...root.querySelectorAll('.ics-pick:checked')].map(cb => cb.value);
    if (picks.length === 0) {
      alert('Please select at least one file.');
      return;
    }
    close();
    // Concatenate the .ics text bodies — parseIcs handles multiple VEVENTs anywhere.
    let combined = '';
    for (const name of picks) {
      try {
        const txt = await fetchServerIcsFile(name);
        combined += txt + '\n';
      } catch (err) {
        console.error(`Failed to fetch ${name}:`, err);
      }
    }
    if (combined) await importIcsText(combined, `${picks.length} server file(s)`);
  };
}

function askImportMode(totalCount, conflictCount) {
  return new Promise(resolve => {
    const root = document.getElementById('modal-root');
    const conflictMsg = conflictCount > 0
      ? `<p style="color:#c62828;"><strong>${conflictCount}</strong> of these conflict with existing events on the same date.</p>`
      : '<p style="color:#2e7d32;">No conflicts with existing events.</p>';
    root.innerHTML = `
      <div class="modal-backdrop" id="ics-backdrop">
        <div class="modal" style="max-width:480px;">
          <h2>Import ${totalCount} event${totalCount === 1 ? '' : 's'}</h2>
          ${conflictMsg}
          <p style="font-size:0.9rem;color:#555;">How should conflicts be handled?</p>
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
            <button class="btn btn-primary" data-mode="merge">Merge — add new dates only, keep existing</button>
            <button class="btn" data-mode="overwrite">Overwrite — replace title, description, and images on conflicts</button>
            <button class="btn" data-mode="skip">Skip conflicts — same as Merge</button>
          </div>
          <div class="modal-actions">
            <button class="btn" data-mode="">Cancel</button>
          </div>
          <p style="font-size:0.75rem;color:#999;margin-top:12px;">
            New dates always import their embedded images. Overwrite replaces existing images
            for that date with the ones in the .ics file.
          </p>
        </div>
      </div>
    `;
    state.modalOpen = true;
    const close = (mode) => {
      root.innerHTML = '';
      state.modalOpen = false;
      resolve(mode || null);
    };
    root.querySelectorAll('button[data-mode]').forEach(b => {
      b.onclick = () => close(b.dataset.mode);
    });
    document.getElementById('ics-backdrop').addEventListener('click', e => {
      if (e.target.id === 'ics-backdrop') close(null);
    });
  });
}


/* ---- ?scrapbook=YYYY-MM-DD deep link ----
 * When the page loads with ?scrapbook=YYYY-MM-DD, auto-fetch the matching
 * .ics from the server (if the event isn't already in local IndexedDB),
 * install it silently, then open the scrapbook popup for that date.
 * This is the landing target used by URLs embedded in emailed .ics files.
 */
async function fetchAndInstallScrapbookIcs(dateKey) {
  let files;
  try {
    files = await listServerIcsFiles();
  } catch (err) {
    console.warn('Could not list server .ics files:', err);
    return false;
  }
  // Prefer scrapbook-<dateKey>-*.ics, then any *<dateKey>*.ics
  const prefix = `scrapbook-${dateKey}`;
  const candidates = files.filter(f => f.name.startsWith(prefix));
  const fallback  = files.filter(f => f.name.includes(dateKey) && !candidates.includes(f));
  const ordered   = candidates.concat(fallback);
  if (ordered.length === 0) return false;
  // Pick most recently modified
  ordered.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  const pick = ordered[0];
  let text;
  try {
    text = await fetchServerIcsFile(pick.name);
  } catch (err) {
    console.warn('Could not fetch', pick.name, err);
    return false;
  }
  const incoming = parseIcs(text);
  const ev = incoming.find(e => e.dateKey === dateKey) || incoming[0];
  if (!ev) return false;

  // Silent install (no conflict dialog) — only create if missing.
  // Check by UID first (matches scrapbook-<id>@local), then fall back to dateKey+title match.
  let alreadyExists = null;
  if (ev.uid) {
    const m = ev.uid.match(/^scrapbook-(.+)@local$/);
    if (m) alreadyExists = await getEventById(m[1]);
  }
  if (!alreadyExists) {
    const existingOnDate = await getEventsForDate(ev.dateKey);
    alreadyExists = existingOnDate.find(e => e.title === ev.title) || null;
  }
  if (alreadyExists) return true;
  const fresh = {
    dateKey:     ev.dateKey,
    category:    'personal',
    readOnly:    false,
    source:      null,
    title:       ev.title,
    description: ev.description,
    imageIds:    [],
    imageUrls:   (ev.importedUrls || []).map((url, i) => ({ url, addedAt: Date.now() + i })),
  };
  await putEvent(fresh);
  const ids = [];
  for (const att of (ev.attachments || [])) {
    try {
      const { width, height } = await imageDimensions(att.blob);
      const rec = await addImage(ev.dateKey, att.blob, att.mime, width, height);
      ids.push(rec.id);
    } catch (err) {
      console.warn('Failed to install attachment', err);
    }
  }
  if (ids.length > 0) {
    fresh.imageIds = ids;
    await putEvent(fresh);
  }
  return true;
}

async function maybeOpenScrapbookFromUrl() {
  const params = new URLSearchParams(location.search);
  const dateKey = params.get('scrapbook');
  if (!dateKey || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
  let ev = await getEvent(dateKey);
  if (!ev) {
    const ok = await fetchAndInstallScrapbookIcs(dateKey);
    if (ok) {
      await renderCalendar();
      ev = await getEvent(dateKey);
    }
  }
  if (!ev) {
    showToast(`No scrapbook found for ${dateKey}`, () => {});
    return;
  }
  openScrapbook(dateKey);
}

(async function init() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(()=>{});
    }
    document.getElementById('importIcsBtn').onclick = openServerIcsBrowser;
    await renderCalendar();
    await maybeOpenScrapbookFromUrl();
  } catch (e) {
    console.error(e);
    document.body.innerHTML = '<pre style="padding:20px;color:red;">' +
      escapeHtml(e.stack || e.message) + '</pre>';
  }
})();
</script>
